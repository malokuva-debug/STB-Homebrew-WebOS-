<!DOCTYPE html><html><head><meta charset="utf-8"><title>STB Player</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#e8eef7;font:26px/1.3 sans-serif;overflow:hidden}
video{position:fixed;top:0;left:0;width:100%;height:100%;background:#000}
.scr{position:fixed;top:0;left:0;width:100%;height:100%;display:none;background:#101826;padding:48px 120px;overflow:auto}
.scr.on{display:block}
#main{background:none;padding:0;overflow:hidden}
#panel{position:absolute;top:0;left:0;bottom:0;width:64%;display:-webkit-flex;display:flex;background:rgba(16,24,38,.92)}
#panel.h{display:none}
.col{overflow-y:auto;height:100%;padding:16px 0 70px}
#cats{width:34%;border-right:1px solid #2a3a55}#chs{-webkit-flex:1;flex:1}
#hint{position:absolute;left:0;right:0;bottom:0;padding:14px 24px;background:#0b111c;color:#8fa3bf;font-size:20px}
.f{padding:12px 20px;margin:4px 10px;border-radius:8px;border:3px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f:focus{outline:0;border-color:#4da3ff;background:#1d3250}
input.f{display:block;width:calc(100% - 20px);background:#0b111c;color:#fff;font:inherit;margin-bottom:14px}
#q{margin-bottom:6px}
.go{background:#4da3ff;color:#101826;font-weight:bold;text-align:center;width:360px}
.go:focus{background:#8cc4ff}.alt{background:#1d3250;color:#e8eef7}
h1{margin:0 0 6px;font-size:44px}.dim{color:#8fa3bf;margin:12px 10px 4px}.sub{color:#8fa3bf;margin:0 10px 24px}
#t{position:fixed;bottom:40px;right:60px;background:#1d3250;padding:12px 24px;border-radius:8px;display:none;z-index:9}
</style></head><body>
<video id="v" autoplay></video>
<div class="scr on" id="setup"><h1>STB Player</h1><p class="sub">Enter your portal and MAC address. RED settings, BLUE saved sources.</p>
<div class="dim">Portal URL</div><input class="f" id="portal" placeholder="http://host:port/c/">
<div class="dim">MAC address</div><input class="f" id="mac" placeholder="00:1A:79:00:00:00">
<div class="f go" tabindex="0" onclick="connect()">Connect</div>
<div class="f go alt" tabindex="0" onclick="openSrc()">Saved sources</div>
<div class="f go alt" tabindex="0" onclick="openSet()">Settings</div></div>
<div class="scr" id="src"></div><div class="scr" id="set"></div>
<div class="scr" id="main"><div id="panel"><div class="col" id="cats"></div>
<div class="col" id="chs"><input class="f" id="q" placeholder="Search channels (YELLOW)"><div id="list"></div></div>
<div id="hint">RED Settings · GREEN Favorites · YELLOW Search · BLUE Sources · RIGHT or INFO = add/remove star</div></div></div>
<div id="t"></div>
<script>
var D={portal:'',mac:'00:1A:79:',buf:'extreme',res:'auto',lat:0,stall:20,perf:1,retries:3,viaproxy:0,model:'MAG250',sn:'',did:'',tz:'Europe/London',ua:'',login:'',pass:'',port:8899,sources:[],cur:-1,fav:{},v:0};
var O={buf:['ultra','low','balanced','stable','smooth','extreme','max'],res:['auto','1080','720','480'],lat:[0,3,4,6,10],stall:[4,6,8,12,20,30],retries:[0,1,3,5,10],viaproxy:[0,1],perf:[0,1],model:['MAG250','MAG254','MAG322','MAG324'],port:[8899,8898,9000]};
var L={buf:'Buffer profile (extreme/max = smoothest)',res:'Max resolution',lat:'Snap to live edge when behind (s, 0 = off)',stall:'Reload if stalled for (s)',retries:'Auto-retries on failure',viaproxy:'Play stream through proxy (1 = yes)',perf:'Performance mode (1 = free app memory while playing)',model:'STB model',sn:'Serial number',did:'Device ID',tz:'Timezone',ua:'Custom user agent',login:'Portal login (optional)',pass:'Portal password (optional)',port:'Proxy port'};
var B={ultra:[262144,500,2000],low:[524288,1000,4000],balanced:[1048576,2000,8000],stable:[3145728,5000,20000],smooth:[8388608,4000,30000],extreme:[16777216,10000,60000],max:[33554432,20000,120000]};
var S=JSON.parse(localStorage.getItem('s')||'{}'),k,V=document.getElementById('v'),API,TOK,G=[],C=[],F=[],R=0,CAT='*',CUR=-1,SC='setup',PREV='setup',tries=0,w=0,tt,lb=0,ex=0;
for(k in D)if(S[k]===undefined)S[k]=D[k];
if(S.v<2){S.buf='extreme';S.lat=0;S.stall=Math.max(12,S.stall);S.v=2;if(S.portal&&!S.sources.length){S.sources=[{n:host(S.portal),portal:S.portal,mac:S.mac}];S.cur=0}}
if(S.v<3){S.stall=Math.max(20,S.stall);S.v=3;save()}
function $(i){return document.getElementById(i)}
function save(){localStorage.setItem('s',JSON.stringify(S))}
function host(p){return p.replace(/^https?:\/\//,'').split('/')[0]}
function rnd(n){var s='';while(s.length<n)s+=Math.random().toString(16).slice(2).toUpperCase();return s.slice(0,n)}
if(!S.sn)S.sn=rnd(13);if(!S.did)S.did=rnd(64);save();
$('portal').value=S.portal;$('mac').value=S.mac;
function msg(t){var e=$('t');clearTimeout(tt);e.textContent=t;e.style.display=t?'block':'none';tt=setTimeout(function(){e.style.display='none'},4000)}
function show(n){SC=n;['setup','src','set','main'].forEach(function(i){$(i).className='scr'+(i==n?' on':'')});
  if(n=='setup'){V.pause();CUR=-1;wd(0)}var f=document.querySelector('.scr.on .f');if(f)f.focus()}
function PX(){return 'http://127.0.0.1:'+S.port}
function get(u){return new Promise(function(ok,no){var x=new XMLHttpRequest();x.open('GET',u);x.timeout=15000;
  x.onload=function(){x.status<400?ok(x.responseText):no(new Error('Portal replied HTTP '+x.status))};
  x.onerror=x.ontimeout=function(){no(new Error('Network error'))};x.send()})}
function pu(u,tok){return PX()+'/p?u='+encodeURIComponent(u)+'&mac='+encodeURIComponent(S.mac)+'&tz='+encodeURIComponent(S.tz)+'&model='+S.model+(S.ua?'&ua='+encodeURIComponent(S.ua):'')+(tok?'&tok='+encodeURIComponent(tok):'')}
function api(q,tok){var s='';for(var k in q)s+='&'+k+'='+encodeURIComponent(q[k]);
  return get(pu(API+'?'+s.slice(1)+'&JsHttpRequest=1-xml',tok)).then(function(t){return JSON.parse(t).js})}
function startProxy(){return new Promise(function(ok,no){
  try{var b=new PalmServiceBridge();b.onservicecallback=function(){};b.call('luna://com.ny0.stbplayer.service/start','{}')}catch(e){}
  var n=0;(function t(){get(PX()+'/ping').then(ok,function(){if(++n>8)no(new Error('Proxy service not running'));else setTimeout(t,500)})})()})}
function bases(){var p=S.portal.trim().replace(/\/+$/,'');if(!/^https?:/.test(p))p='http://'+p;
  if(/\.php$/.test(p))return [p];p=p.replace(/\/c$/,'');return [p+'/server/load.php',p+'/portal.php']}
function hs(){var c=bases(),i=0;
  function next(){if(i>=c.length)return Promise.reject(new Error('Handshake failed - check portal URL and MAC'));API=c[i++];
    return api({type:'stb',action:'handshake',token:''}).then(function(j){if(!j||!j.token)throw 0;TOK=j.token;
      return api({type:'stb',action:'get_profile',hd:1,ver:'ImageDescription: 0.2.18-r14-pub-250; ImageDate: Fri Jan 15 15:20:44 EET 2016; PORTAL version: 5.6.1; API Version: JS API version: 328; STB API version: 134; Player Engine version: 0x566',num_banks:2,sn:S.sn,stb_type:S.model,client_type:'STB',image_version:218,video_out:'hdmi',device_id:S.did,device_id2:S.did,signature:'',auth_second_step:1,hw_version:'1.7-BD-00',not_valid_token:0,api_signature:262,metrics:JSON.stringify({mac:S.mac,sn:S.sn,type:'STB'})},TOK)})
      .then(function(){return S.login?api({type:'stb',action:'do_auth',login:S.login,password:S.pass,device_id:S.did,device_id2:S.did},TOK):0}).catch(next)}
  return next()}
function addSrc(){var i=-1;S.sources.forEach(function(s,j){if(s.portal==S.portal&&s.mac==S.mac)i=j});
  if(i<0){S.sources.push({n:host(S.portal),portal:S.portal,mac:S.mac});i=S.sources.length-1}S.cur=i;save()}
function connect(){S.portal=$('portal').value;S.mac=$('mac').value.toUpperCase();addSrc();V.pause();CUR=-1;wd(0);msg('Connecting...');
  startProxy().then(hs).then(function(){return Promise.all([api({type:'itv',action:'get_genres'},TOK),api({type:'itv',action:'get_all_channels'},TOK)])})
  .then(function(r){G=[{id:'fav',title:'\u2605 Favorites'},{id:'*',title:'All channels'}].concat(r[0]||[]);C=(r[1]&&r[1].data)||[];
    C.sort(function(a,b){return a.number-b.number});msg(C.length+' channels');show('main');$('panel').className='';drawCats();pick('*')})
  .catch(function(e){msg(e.message||'Connection failed')})}
function useSrc(i){var s=S.sources[i];$('portal').value=s.portal;$('mac').value=s.mac;connect()}
function newSrc(){$('portal').value='';$('mac').value='00:1A:79:';show('setup')}
function openSrc(){if(SC!='src')PREV=SC;var h='<h1>Sources</h1><p class="sub">OK connects. RED deletes the highlighted source. Back returns.</p>';
  S.sources.forEach(function(s,i){h+='<div class="f" tabindex="0" data-s="'+i+'" onclick="useSrc('+i+')">'+(i==S.cur?'\u25CF ':'')+s.n+'  -  '+s.mac+'</div>'});
  $('src').innerHTML=h+'<div class="f go" tabindex="0" onclick="newSrc()">+ New source</div>';show('src')}
function delSrc(a){var i=a.getAttribute('data-s');if(i===null)return;i=+i;S.sources.splice(i,1);if(S.cur==i)S.cur=-1;else if(S.cur>i)S.cur--;save();openSrc()}
function fk(){return S.portal+'|'+S.mac}
function favs(){return S.fav[fk()]||(S.fav[fk()]=[])}
function cid(c){return String(c.id||c.name)}
function isFav(c){return favs().indexOf(cid(c))>=0}
function lab(c,i){return (isFav(c)?'\u2605 ':'')+(c.number||i+1)+'  '+c.name}
function togFav(el){var i=el&&el.getAttribute&&el.getAttribute('data-i');if(i===null||i===undefined||i==='')return;var c=F[+i],a=favs(),p=a.indexOf(cid(c));
  p<0?a.push(cid(c)):a.splice(p,1);save();el.textContent=lab(c,+i);msg(p<0?'Added to favorites':'Removed from favorites')}
function drawCats(){var h=$('cats');h.innerHTML='';
  G.forEach(function(g){var d=document.createElement('div');d.className='f';d.tabIndex=0;d.textContent=g.title;d.onclick=function(){pick(g.id)};h.appendChild(d)});
  var d=document.createElement('div');d.className='f';d.tabIndex=0;d.textContent='Settings';d.onclick=openSet;h.appendChild(d);h.childNodes[1].focus()}
function ui(){if(!$('cats').firstChild&&G.length){drawCats();fill()}}
function inCat(id){return C.filter(function(c){return id=='fav'?isFav(c):id=='*'||String(c.tv_genre_id)==String(id)})}
function fill(){R=0;$('list').innerHTML='';more()}
function pick(id){CAT=id;$('q').value='';F=inCat(id);fill()}
$('q').oninput=function(){var s=this.value.toLowerCase();F=s?C.filter(function(c){return String(c.name).toLowerCase().indexOf(s)>=0}):inCat(CAT);fill()};
function more(){var h=$('list'),e=Math.min(R+100,F.length);
  for(;R<e;R++)(function(i){var d=document.createElement('div');d.className='f';d.tabIndex=0;d.setAttribute('data-i',i);d.textContent=lab(F[i],i);d.onclick=function(){tries=0;play(i)};h.appendChild(d)})(R)}
$('list').addEventListener('focusin',function(e){if(R<F.length&&e.target.nextSibling===null)more()});
function mo(){var b=B[S.buf],o={option:{bufferControl:{userBufferCtrl:true,preBufferByte:b[0],bufferMinLevel:b[1],bufferMaxLevel:b[2]}}};
  if(S.res!='auto')o.option.adaptiveStreaming={maxWidth:Math.round(S.res*16/9),maxHeight:+S.res};return encodeURIComponent(JSON.stringify(o))}
function src(u){var s=document.createElement('source');s.src=u;s.type=(/\.m3u8/.test(u)?'application/x-mpegURL':'video/mp4')+';mediaOption='+mo();
  V.innerHTML='';V.appendChild(s);V.load();V.play()}
function play(i){if(i<0||i>=F.length)return;CUR=i;w=0;lp=-1;wd(1);var c=F[i];msg(c.name);$('panel').className='h';if(S.perf){$('cats').innerHTML='';$('list').innerHTML=''}
  api({type:'itv',action:'create_link',cmd:c.cmd,series:'',forced_storage:0,disable_ad:0,download:0,force_ch_link_check:0},TOK).then(function(j){
    var u=((j&&j.cmd)||c.cmd).replace(/^(ffmpeg|auto|ffrt\d?)\s+/,'');src(S.viaproxy?pu(u):u)}).catch(fail)}
function fail(){if(tries<S.retries){tries++;msg('Retrying ('+tries+'/'+S.retries+')');play(CUR)}else msg('Playback failed')}
V.addEventListener('playing',function(){tries=0;w=0});V.addEventListener('error',function(){if(CUR>=0)fail()});
var WT=0,lp=-1;
function wd(on){clearInterval(WT);if(on)WT=setInterval(tick,2000)}
function tick(){if(CUR<0)return;var e=V.buffered.length?V.buffered.end(V.buffered.length-1):0,p=V.currentTime+e;
  if(V.paused||p>lp+0.01)w=0;else if((w+=2)>S.stall){w=0;fail()}lp=p;
  if(S.lat>0&&e-V.currentTime>S.lat)V.currentTime=e-0.4}
function openSet(){if(SC!='set')PREV=SC;var h='<h1>Settings</h1><p class="sub">Back or RED returns. Left/Right or OK changes a value.</p>';
  for(var k in L)h+=O[k]?'<div class="f" tabindex="0" data-k="'+k+'" onclick="cyc(\''+k+'\',1)">'+L[k]+': <b>'+S[k]+'</b></div>'
    :'<div class="dim">'+L[k]+'</div><input class="f" value="'+String(S[k]).replace(/"/g,'&quot;')+'" oninput="S.'+k+'=this.value;save()">';
  $('set').innerHTML=h;show('set')}
function cyc(k,d){var a=O[k],i=a.indexOf(S[k]);S[k]=a[(i+d+a.length)%a.length];save();document.querySelector('[data-k='+k+'] b').textContent=S[k]}
function nav(k){var a=document.activeElement,l=document.querySelectorAll('.scr.on .f'),r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,best=null,bd=1e9,v=k%2==0;
  for(var i=0;i<l.length;i++){var e=l[i];if(e===a||!e.offsetWidth)continue;var q=e.getBoundingClientRect(),dx=q.left+q.width/2-cx,dy=q.top+q.height/2-cy;
    if(k==40&&dy>5||k==38&&dy<-5||k==39&&dx>5||k==37&&dx<-5){var d=v?Math.abs(dy)+3*Math.abs(dx):Math.abs(dx)+3*Math.abs(dy);if(d<bd){bd=d;best=e}}}
  if(best){best.focus();best.scrollIntoView(false)}}
function go(w){if(!C.length)return msg('Connect first');if(SC!='main')show('main');$('panel').className='';ui();
  if(w=='fav'){pick('fav');if(!F.length)msg('No favorites yet - press RIGHT on a channel to add one')}
  var f=w=='q'?$('q'):($('list').querySelector('.f')||$('q'));f.focus()}
function back(){var n=Date.now();if(n-lb<300)return;lb=n;
  if(SC=='set'||SC=='src')return show(PREV);
  if(SC=='main'){var hid=$('panel').className=='h',a=document.activeElement;
    if(hid)return go('list');
    if($('chs').contains(a)){$('cats').childNodes[1].focus();return}
    if(CUR>=0){$('panel').className='h';return}
    return show('setup')}
  if(n-ex<2000)window.close();else{ex=n;msg('Press Back again to exit')}}
history.pushState({},'');history.pushState({},'');
window.addEventListener('popstate',function(){history.pushState({},'');back()});
document.onkeydown=function(e){var k=e.keyCode,a=document.activeElement,inp=a&&a.tagName=='INPUT',hid=$('panel').className=='h';
  if(k==403){e.preventDefault();if(SC=='src')delSrc(a);else if(SC=='set')show(PREV);else openSet();return}
  if(k==404){e.preventDefault();go('fav');return}
  if(k==405){e.preventDefault();go('q');return}
  if(k==406){e.preventDefault();if(SC=='src')show(PREV);else openSrc();return}
  if(k==457){togFav(a);return}
  if(k>=37&&k<=40){if(inp&&(k==37||k==39))return;e.preventDefault();
    if(SC=='main'&&hid){if(k==38)play(CUR-1);else if(k==40)play(CUR+1);else go('list');return}
    if(SC=='main'&&k==39&&a.parentNode&&a.parentNode.id=='list'){togFav(a);return}
    if(SC=='set'&&(k==37||k==39)&&a.getAttribute('data-k')){cyc(a.getAttribute('data-k'),k==39?1:-1);return}
    nav(k)}
  else if(k==13){if(SC=='main'&&hid)go('list');else if(!inp&&a.click)a.click()}
  else if(k==427||k==33){play(CUR+1)}else if(k==428||k==34){play(CUR-1)}
  else if(k==461||k==27||(k==8&&!inp)){e.preventDefault();back()}};
$('portal').focus();
</script></body></html>
